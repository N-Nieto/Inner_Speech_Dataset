site_name: Inner Speech Dataset
site_description: >-
  An open-access EEG dataset for inner speech recognition (OpenNeuro ds003626):
  the experiment, the data files, and the Python code to download, preprocess and
  analyse them.
site_author: Nicolás Nieto
site_url: https://n-nieto.github.io/Inner_Speech_Dataset/
repo_url: https://github.com/N-Nieto/Inner_Speech_Dataset
repo_name: N-Nieto/Inner_Speech_Dataset
edit_uri: edit/main/docs/
copyright: >-
  Code: GPL-3.0 · Data: CC0 ·
  Nieto et al. (2022), <em>Scientific Data</em> 9:52

# Only the site pages; the generator script is not part of the site
exclude_docs: |
  scripts/
  snippets/

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

hooks:
  - docs/scripts/sphinx_roles.py

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/innerspeech.js

nav:
  - Home: index.md
  - The dataset:
      - dataset/index.md
      - The experiment: dataset/experiment.md
      - Event codes: dataset/events.md
      - Files and formats: dataset/files.md
      - Sessions at a glance: dataset/sessions.md
      - Notes and versions: dataset/notes.md
  - Get started:
      - start/index.md
      - Install: start/install.md
      - Download: start/download.md
      - Load and analyse: start/load.md
      - Preprocessing: start/preprocessing.md
      - Check your copy: start/checks.md
  - Code:
      - code/index.md
      - API reference:
          - code/api/download_helper.md
          - code/api/data_extractions.md
          - code/api/data_processing.md
          - code/api/derivatives_io.md
          - code/api/events_analysis.md
          - code/api/protocol.md
          - code/api/emg_control.md
          - code/api/utils.md
          - code/api/exceptions.md
      - Development: code/development.md
  - Cite: cite.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://pandas.pydata.org/docs/objects.inv
            - https://mne.tools/stable/objects.inv
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            filters: ["!^_"]
            show_source: true
            heading_level: 2
            merge_init_into_class: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [docs/snippets]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/N-Nieto/Inner_Speech_Dataset
      name: Code on GitHub
    - icon: material/database
      link: https://openneuro.org/datasets/ds003626
      name: Data on OpenNeuro
    - icon: material/file-document
      link: https://doi.org/10.1038/s41597-022-01147-2
      name: Paper in Scientific Data
